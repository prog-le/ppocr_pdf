version: '3.8'

services:
  ## ─── GPU OCR API 服务 ───────────────────────────────────────
  paddleocr-pdf:
    build:
      context: .
      args:
        # GPU 构建：使用含 CUDA 11.8 + cuDNN 8.9 的基础镜像
        BASE_IMAGE: nvidia/cuda:11.8.0-cudnn8-runtime-ubuntu22.04
        PADDLE_PACKAGE: paddlepaddle-gpu
        # pip 镜像源；注意 paddlepaddle-gpu (759MB) 在国内镜像上经常下载中断
        # 改用 PyPI 官方源以保证大文件下载稳定性
        PIP_INDEX_URL: https://pypi.org/simple/
    image: paddleocr-pdf:gpu
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/.paddlex
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=info
      - PORT=8000
      # 运行时 pip 源（如果容器内有 pip install 操作）
      - PIP_INDEX_URL=https://pypi.org/simple/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8g
    restart: unless-stopped
    user: "1000:1000"

  ## ─── 模型预下载（使用 modelscope）────────────────────────
  # 用法：先运行此服务下载模型到本地，再启动主服务
  #   docker compose -f docker-compose.gpu.yml run --rm download-models
  download-models:
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:11.8.0-cudnn8-runtime-ubuntu22.04
        PADDLE_PACKAGE: paddlepaddle-gpu
        PIP_INDEX_URL: https://pypi.org/simple/
    image: paddleocr-pdf:gpu
    volumes:
      - ./models:/app/.paddlex
    environment:
      - DISABLE_MODEL_SOURCE_CHECK=True
      - FLAGS_enable_pir_api=0
      - PADDLEX_HOME=/app/.paddlex
    # 使用 modelscope 镜像下载 pp-ocrv5 + paddleocr-vl 模型
    command: >
      sh -c "
        python download_models.py -m pp-ocrv5,paddleocr-vl -o /app/.paddlex -l info
      "
    # 一次性任务，运行完就退出
    profiles:
      - manual
